# GitHub Dependency Review Action Configuration
# Reference: https://github.com/actions/dependency-review-action

# Fail on moderate, high, or critical vulnerabilities introduced by PRs
fail-on-severity: moderate

# Scan both runtime and development dependency scopes
fail-on-scopes:
  - runtime
  - development

# Disallow viral copyleft and network-copyleft licenses incompatible with SaviTools' MIT license
deny-licenses:
  - AGPL-1.0-only
  - AGPL-1.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - GPL-1.0-only
  - GPL-1.0-or-later
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - LGPL-2.0-only
  - LGPL-2.0-or-later
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later

# Denied specific packages (e.g. known abandoned or typo-squatted packages)
deny-packages: []

# Retry when dependency snapshot submission is still processing
retry-on-snapshot-warnings: true
